<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Drive</title>
    <meta name="description" content="Personal cloud storage powered by Telegram. Upload, organize, and access your files from anywhere.">
    <link rel="stylesheet" href="/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- ═══════════ LOGIN SCREEN ═══════════ -->
    <div id="login-screen" class="screen active">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="logo">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="url(#grad)" stroke-width="1.5">
                            <defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#6C63FF"/>
                                <stop offset="100%" style="stop-color:#3B82F6"/>
                            </linearGradient></defs>
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                    </div>
                    <h1>Telegram Drive</h1>
                    <p class="subtitle">Your personal cloud, powered by Telegram</p>
                </div>

                <!-- Password Login -->
                <div id="login-form">
                    <label for="password-input">Password</label>
                    <div class="input-group">
                        <input type="password" id="password-input" placeholder="Enter password" autocomplete="current-password">
                        <button id="login-btn" class="btn-primary" onclick="login()">
                            <span class="btn-text">Login</span>
                            <span class="btn-loader hidden"></span>
                        </button>
                    </div>
                    <p class="hint">Enter the password set in your APP_PASSWORD config</p>
                </div>

                <div id="login-error" class="error-msg hidden"></div>
            </div>
        </div>
    </div>

    <!-- ═══════════ MAIN DRIVE SCREEN ═══════════ -->
    <div id="drive-screen" class="screen">
        <!-- Top Bar -->
        <header class="topbar">
            <div class="topbar-left">
                <button class="hamburger" id="sidebar-toggle" onclick="toggleSidebar()">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
                    </svg>
                </button>
                <h2 class="app-title">Telegram Drive</h2>
            </div>
            <div class="topbar-right">
                <span id="user-info" class="user-badge"></span>
                <button class="btn-ghost" onclick="logout()">Logout</button>
            </div>
        </header>

        <div class="drive-layout">
            <!-- Sidebar -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-section">
                    <div class="sidebar-header">
                        <h3>Folders</h3>
                        <button class="btn-icon" onclick="showCreateFolderModal()" title="New folder">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                            </svg>
                        </button>
                    </div>
                    <ul id="folder-list" class="folder-list">
                        <!-- Folders rendered by JS -->
                    </ul>
                </div>
                <div class="sidebar-footer">
                    <div id="storage-info" class="storage-info">
                        <div class="storage-bar"><div class="storage-fill" id="storage-fill"></div></div>
                        <span class="storage-text" id="storage-text">∞ storage available</span>
                    </div>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <div class="content-header">
                    <h2 id="current-folder-title">Root</h2>
                    <div class="content-actions">
                        <button class="btn-primary btn-upload" onclick="triggerUpload()">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                            Upload
                        </button>
                    </div>
                </div>

                <!-- Breadcrumb navigation -->
                <nav class="breadcrumb-nav" id="breadcrumb-bar">
                    <!-- Rendered by JS -->
                </nav>

                <!-- Upload drop zone -->
                <div class="drop-zone" id="drop-zone">
                    <input type="file" id="file-input" style="display:none" multiple>
                    <p>Drop files here to upload</p>
                </div>

                <!-- Upload progress -->
                <div id="upload-progress-container" class="upload-progress hidden">
                    <div class="progress-info">
                        <span id="upload-filename">Uploading...</span>
                        <span id="upload-percent">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="upload-progress-fill"></div>
                    </div>
                </div>

                <!-- File list -->
                <div id="files-container">
                    <table class="file-table" id="files-table">
                        <thead>
                            <tr>
                                <th class="col-name">Name</th>
                                <th class="col-size">Size</th>
                                <th class="col-actions">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="files-tbody"></tbody>
                    </table>
                    <div id="empty-state" class="empty-state hidden">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
                        </svg>
                        <p>No files in this folder</p>
                        <p class="hint">Drag & drop files or click Upload</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- ═══════════ CREATE FOLDER MODAL ═══════════ -->
    <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal()">
        <div class="modal-card" onclick="event.stopPropagation()">
            <h3 id="modal-title">New Folder</h3>
            <input type="text" id="modal-input" placeholder="Folder name" autofocus>
            <div id="modal-error" class="error-msg hidden"></div>
            <div class="modal-actions">
                <button class="btn-ghost" onclick="closeModal()">Cancel</button>
                <button class="btn-primary" id="modal-confirm-btn" onclick="confirmModal()">Create</button>
            </div>
        </div>
    </div>

    <!-- ═══════════ CONTEXT MENU (Folder) ═══════════ -->
    <div id="context-menu" class="context-menu hidden">
        <button onclick="renameFolderAction()">Rename</button>
        <button class="danger" onclick="deleteFolderAction()">Delete</button>
    </div>

    <script src="/app.js"></script>
</body>
</html>
